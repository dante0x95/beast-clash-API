# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel the previous run when new pushes arrive on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://beast:beast@localhost:5433/beast_clash_test

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: beast
          POSTGRES_PASSWORD: beast
          POSTGRES_DB: beast_clash_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U beast -d beast_clash_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --target runtime -t beast-clash-api:ci .