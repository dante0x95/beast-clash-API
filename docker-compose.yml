services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: beast
      POSTGRES_PASSWORD: beast
      POSTGRES_DB: beast_clash
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beast -d beast_clash"]
      interval: 5s
      timeout: 3s
      retries: 10

  # production image, opt-in: docker compose --profile app up --build
  migrate:
    profiles: [app]
    build: .
    image: beast-clash-api:local
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://beast:beast@db:5432/beast_clash
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: [app]
    build: .
    image: beast-clash-api:local
    environment:
      DATABASE_URL: postgresql://beast:beast@db:5432/beast_clash
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: