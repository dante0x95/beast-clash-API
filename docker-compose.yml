services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: beast
      POSTGRES_PASSWORD: beast
      POSTGRES_DB: beast_clash
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beast -d beast_clash"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: